traefik_network_name: traefik_network

networks:
  - "{{ traefik_network_name }}"

traefik_labels:
  - "traefik.enable=true"
  - "traefik.http.routers.{{ item.name }}.rule=Host(`{{ item.name }}.{{ homeserver_domain }}`)"
  - "traefik.http.routers.{{ item.name }}.entrypoints=web"
  - "traefik.http.services.{{ item.name }}.loadbalancer.server.port={{ item.port }}"

services:
  - name: traefik
    version: "v3.7.17"
    enabled: true
  - name: heimdall
    version: "2.8.4"
    port: 80
    enabled: true
  - name: gitea
    version: "28.2.0"
    port: 3000
    enabled: true
    storage_local:
      owner: "{{ PUID }}"
      group: "{{ PUID }}"
      directories:
        - "{{ storage_path }}/gitea_data"
  - name: nextcloud
    version: "35-apache"
    port: 80
    storage_local:
      owner: 33
      group: 33
      directories:
        - "{{ storage_path }}/nextcloud_data"
    enabled: true
  - name: arr-stack
    version: "latest"
    port: 80
    storage_local:
      owner: "{{ PUID }}"
      group: "{{ PGID }}"
      directories:
        - "{{ storage_path }}/media/movies"
        - "{{ storage_path }}/media/tvshows"
        - "{{ storage_path }}/torrents"
    enabled: true

# Disabled stacks

  - name: dockhand
    version: "v1.0.56"
    port: 3000
    enabled: false