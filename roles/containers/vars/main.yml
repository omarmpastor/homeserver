traefik_network_name: traefik_network

networks:
  - "{{ traefik_network_name }}"

traefik_labels:
  - "traefik.enable=true"
  - "traefik.http.routers.{{ item.name }}.rule=Host(`{{ item.name }}.{{ homeserver_domain }}`)"
  - "traefik.http.routers.{{ item.name }}.entrypoints=web"
  - "traefik.http.services.{{ item.name }}.loadbalancer.server.port={{ item.port }}"

services:
  - name: traefik
    version: "v3.7.17"
    enabled: true
  - name: heimdall
    version: "2.8.4"
    port: 80
    enabled: true
  - name: gitea
    version: "28.2.0"
    port: 3000
    enabled: true
  - name: nextcloud
    version: "35-apache"
    port: 80
    storage_local:
      owner: 33
      group: 33
      directories:
        - "{{ storage_path }}/nextcloud_data"
    enabled: true
  - name: jellyfin
    version: "amd64-version-12.4ubu2604"
    port: 8096
    storage_local:
      owner: "{{ PUID }}"
      group: "{{ PGID }}"
      directories:
        - "{{ storage_path }}/media/movies"
        - "{{ storage_path }}/media/tvshows"
        - "{{ storage_path }}/media/videos"
    enabled: true
  - name: qbittorrent
    version: "amd64-5.3.0"
    port: 8090
    storage_local:
      owner: "{{ PUID }}"
      group: "{{ PGID }}"
      directories:
        - "{{ storage_path }}/torrents"
    enabled: true
  - name: bazarr
    version: "amd64-1.6.2"
    port: 6767
    enabled: true
  - name: jackett
    version: "amd64-0.24.2985"
    port: 9117
    enabled: true
  - name: prowlarr
    version: "amd64-2.7.0"
    port: 9696
    enabled: true
  - name: radarr
    version: "amd64-6.4.4"
    port: 7878
    storage_local:
      owner: "{{ PUID }}"
      group: "{{ PGID }}"
      directories:
        - "{{ storage_path }}/media/movies"
    enabled: true
  - name: sonarr
    version: "amd64-4.0.20"
    port: 8989
    storage_local:
      owner: "{{ PUID }}"
      group: "{{ PGID }}"
      directories:
        - "{{ storage_path }}/media/tvshows"
    enabled: true

# Servicios no habilitados, establecer enabled: true para activar

  - name: metube
    version: "latest"
    port: 8081
    enabled: false     

  - name: dockhand
    version: "latest"
    port: 3000
    enabled: false

  - name: pihole
    version: "latest"
    port: 80
    password: "{{ apps_password | default('admin123') }}"
    enabled: false

  - name: mealie
    version: "v3.28.0"
    port: 9000
    enabled: false

  - name: immich
    version: "v3"
    port: 2283
    enabled: false
    storage_local:
      owner: "{{ PUID }}"
      group: "{{ PGID }}"
      directories:
        - "{{ storage_path }}/immich_data"

  - name: ollama
    version: "latest"
    port: 11434
    enabled: false

  - name: hermes
    version: "latest"
    port: 9119
    enabled: false
    # storage_local:
    #   owner: 1000
    #   group: 1000
    #   directories:
    #     - "{{ storage_path }}/hermes_data"