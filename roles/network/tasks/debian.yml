---
- name: Install NetworkManager
  ansible.builtin.apt:
    name: network-manager
    state: present
    update_cache: true

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Configure NetworkManager
  ansible.builtin.template:
    src: NetworkManager.conf.j2
    dest: /etc/NetworkManager/NetworkManager.conf
    owner: root
    group: root
    mode: '0644'

- name: Create NetworkManager connection
  ansible.builtin.template:
    src: connection.nmconnection.j2
    dest: "/etc/NetworkManager/system-connections/ansible-{{ network_interface }}.nmconnection"
    owner: root
    group: root
    mode: '0600'
    backup: true
  register: nmconnection

- name: Validate the NetworkManager connection profile
  ansible.builtin.command:
    cmd: "nmcli connection load /etc/NetworkManager/system-connections/ansible-{{ network_interface }}.nmconnection"
  changed_when: false
  when: nmconnection is changed

- name: Comprobar si NetworkManager gestiona la interfaz ahora mismo
  ansible.builtin.command:
    cmd: "nmcli -t -f GENERAL.STATE device show {{ network_interface }}"
  register: nm_device_state
  changed_when: false
  failed_when: false

- name: Guardar si NetworkManager gestiona la interfaz ahora mismo
  ansible.builtin.set_fact:
    nm_manages_interface: "{{ '100' in (nm_device_state.stdout | default('')) }}"

- name: Habilitar NetworkManager para el próximo reinicio
  ansible.builtin.service:
    name: NetworkManager
    enabled: true
    state: "{{ 'started' if nm_manages_interface | bool else 'stopped' }}"

- name: Disable networking.service on next boot
  ansible.builtin.service:
    name: networking
    enabled: false
  when: "'networking.service' in ansible_facts['services']"

- name: Disable systemd-networkd on next boot
  ansible.builtin.service:
    name: systemd-networkd
    enabled: false
  when: "'systemd-networkd.service' in ansible_facts['services']"

- name: Disable systemd-networkd-wait-online on next boot
  ansible.builtin.service:
    name: systemd-networkd-wait-online
    enabled: false
  when: "'systemd-networkd-wait-online.service' in ansible_facts['services']"