services:
  db:
    image: docker.io/library/postgres:17-alpine3.23
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    volumes:
      - ${NEXTCLOUD_DB_VOLUME:-nextclouddb_data}:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8.6-alpine
    command: redis-server --requirepass redis-falsa-de-laboratorio
    networks:
      - internal_network
    restart: unless-stopped

  app:
    image: docker.io/library/nextcloud:${NEXTCLOUD_VERSION:-35-apache}
    ports:
      - "${NEXTCLOUD_PORT:-8081}:${NEXTCLOUD_DEFAULT_PORT:-80}"
    volumes:
      - ${NEXTCLOUD_CONFIG_VOLUME:-nextcloud_config}:/var/www/html/config
      - ${NEXTCLOUD_CUSTOM_APPS_VOLUME:-nextcloud_custom_apps}:/var/www/html/custom_apps
      - ${NEXTCLOUD_DATA_VOLUME:-${STORAGE_PATH:-/storage}/nextcloud_data}:/var/www/html/data:Z
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      PHP_MEMORY_LIMIT: 1G
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:-}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-nextcloud.${HOMESERVER_DOMAIN:-home.arpa}}
    networks:
      - internal_network
      - ${TRAEFIK_NETWORK_NAME:-traefik_network}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${HOMESERVER_DOMAIN:-home.arpa}`)"
      - "traefik.http.routers.nextcloud.entrypoints=web"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=${NEXTCLOUD_DEFAULT_PORT:-80}"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php || exit 1"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  cron:
    image: docker.io/library/nextcloud:${NEXTCLOUD_VERSION:-35-apache}
    entrypoint: /cron.sh
    volumes:
      - ${NEXTCLOUD_CONFIG_VOLUME:-nextcloud_config}:/var/www/html/config
    networks:
      - internal_network
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

networks:
  traefik_network:
    name: ${TRAEFIK_NETWORK_NAME:-traefik_network}
    external: true
  internal_network:
    internal: true

volumes:
  nextclouddb_data:
    name: ${NEXTCLOUD_DB_VOLUME:-nextclouddb_data}
  nextcloud_config:
    name: ${NEXTCLOUD_CONFIG_VOLUME:-nextcloud_config}
  nextcloud_custom_apps:
    name: ${NEXTCLOUD_CUSTOM_APPS_VOLUME:-nextcloud_custom_apps}
