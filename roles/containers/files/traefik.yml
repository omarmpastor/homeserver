services:
  traefik:
    image: docker.io/library/traefik:${TRAEFIK_VERSION:-v3.6}
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ${DOCKER_SOCKET_VOLUME:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - ${TRAEFIK_NETWORK_NAME:-traefik_network}
    restart: unless-stopped

networks:
  traefik_network:
    name: ${TRAEFIK_NETWORK_NAME:-traefik_network}
    external: true
